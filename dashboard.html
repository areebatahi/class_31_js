<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link
      rel="shortcut icon"
      href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQul-pND6LK7QiK1qf5IBr3ZWqR8DsYbw295Q&s"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Header -->
    <nav
      class="navbar fixed-top navbar-expand-lg navbar-dark header-glass px-4 py-3 shadow"
    >
      <div
        class="container-fluid d-flex justify-content-between align-items-center"
      >
        <h2 class="text-white mb-0">Quiz App</h2>
        <button
          class="btn btn-light text-danger fw-bold px-4 logout-btn"
          onclick="redirect()"
        >
          Log Out
        </button>
      </div>
    </nav>

    <!-- Centered Welcome Section -->
    <section
      class="d-flex flex-column justify-content-center align-items-center text-center start-section " id="card"
    >
      <h3 class="text-white mb-4">Welcome to the Quiz!</h3>
      <button
        onclick="showContainer()"
        class="btn btn-outline-light btn-lg px-5"
      >
        Start Quiz
      </button>
    </section>

    <!-- Hidden Quiz Section -->
       <section
      class="d-flex flex-column justify-content-center align-items-center start-section "
    >
    <div class="container mt-5" id="hidden">
      <div id="container" class="glass-container p-4">
        <!-- Quiz content gets rendered here -->
      </div>
      </div>
    </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="dashboard.js"></script>
    <script src="app.js"></script>
  </body>
</html>
